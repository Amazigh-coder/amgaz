
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1033">
<title>Joyeux anniversaire&nbsp;!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --plum:#1d1033; --plum-2:#321a57; --pink:#ff4f8b; --sun:#ffd23f; --mint:#3ee6b0; --cream:#fff6ec; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    height:100dvh; overflow:hidden; color:var(--cream); text-align:center;
    background:radial-gradient(120% 70% at 50% 85%, var(--plum-2), var(--plum) 70%);
    font-family:"DM Sans", system-ui, sans-serif; -webkit-tap-highlight-color:transparent;
  }
  /* scenes + transitions */
  .scene {
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.25rem;
    padding:max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
    opacity:0; visibility:hidden; transform:scale(.88) translateY(40px);
    transition:opacity .6s, transform .7s cubic-bezier(.2,.9,.3,1.2), visibility 0s .7s;
  }
  .scene.active { opacity:1; visibility:visible; transform:none; transition-delay:0s; }
  .scene.past { transform:scale(1.15) translateY(-50px); }

  h1, h2 { font-family:"Bagel Fat One", sans-serif; font-weight:400; line-height:1; color:var(--sun); text-shadow:0 4px 0 var(--pink); }
  h1 { font-size:clamp(2.1rem, 10.5vw, 4rem); }
  h2 { font-size:clamp(2rem, 10vw, 3rem); }
  h1 span, h2 span { display:block; }
  .hint { min-height:1.5em; font-weight:600; font-size:1.05rem; }
  .hint.pulse { animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.45; } }

  .tap { width:min(78vw, 320px); height:auto; cursor:pointer; touch-action:manipulation; }
  .tap:focus-visible { outline:3px solid var(--sun); outline-offset:6px; border-radius:16px; }

  /* gift */
  #gift { width:min(62vw, 250px); animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-10px) rotate(2deg); } }
  #gift.shake { animation:shake .55s linear; }
  @keyframes shake {
    0%,100% { transform:rotate(0); } 15% { transform:rotate(-9deg) scale(1.05); } 35% { transform:rotate(9deg) scale(1.08); }
    55% { transform:rotate(-7deg) scale(1.1); } 75% { transform:rotate(6deg) scale(1.1); }
  }
  #gift .lid { transition:transform .6s cubic-bezier(.3,1.6,.5,1); transform-box:fill-box; transform-origin:center; }
  #gift.open { animation:none; }
  #gift.open .lid { transform:translate(-30px,-90px) rotate(-28deg); }
  #gift .shine { opacity:0; transition:opacity .4s; }
  #gift.open .shine { opacity:.35; }

  /* cake */
  .flame { fill:var(--sun); opacity:0; transform:scale(0); transform-box:fill-box; transform-origin:center bottom; transition:opacity .25s, transform .3s cubic-bezier(.3,1.8,.5,1); }
  .flame.on { opacity:1; transform:scale(1); animation:flicker .35s ease-in-out infinite alternate; }
  @keyframes flicker { from { transform:scale(1) rotate(-3deg); } to { transform:scale(1.12,.94) rotate(3deg); } }
  #glow { fill:var(--sun); opacity:0; transition:opacity .5s; }

  button {
    font:inherit; font-weight:600; font-size:1.05rem; color:var(--plum); background:var(--mint);
    border:0; border-radius:999px; padding:.9rem 1.75rem; min-height:48px; cursor:pointer;
    box-shadow:0 5px 0 #1fa883; transition:transform .1s, box-shadow .1s;
  }
  button:active { transform:translateY(4px); box-shadow:0 1px 0 #1fa883; }
  button:focus-visible { outline:3px solid var(--sun); outline-offset:4px; }

  #card { max-width:22rem; background:var(--cream); color:var(--plum); border-radius:24px; padding:1.5rem 1.5rem 1.25rem; transform:rotate(-1.5deg); }
  #card.pop { animation:cardin .8s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes cardin { from { transform:rotate(-8deg) scale(.5); opacity:0; } }
  #msg { font-size:1.15rem; line-height:1.5; }
  #from { margin-top:.9rem; font-family:"Bagel Fat One", sans-serif; color:var(--pink); font-size:1.3rem; }
  #again { margin-top:1rem; background:var(--pink); box-shadow:0 5px 0 #c2305f; color:var(--cream); }
  #again:active { box-shadow:0 1px 0 #c2305f; }

  /* flowers */
  #garden { position:fixed; left:0; right:0; bottom:0; height:0; z-index:1; pointer-events:none; transform-origin:50% 100%; transition:transform .9s cubic-bezier(.3,1.4,.5,1); }
  #garden.big { transform:scale(1.15); }
  .fl { position:absolute; bottom:-6px; transform-origin:50% 100%; animation:grow 1.1s cubic-bezier(.3,1.5,.5,1) both var(--d), sway 3.6s ease-in-out infinite alternate calc(var(--d) + 1.1s); }
  @keyframes grow { from { transform:scale(0); } to { transform:scale(1); } }
  @keyframes sway { from { transform:rotate(-3deg); } to { transform:rotate(3deg); } }

  /* balloons */
  #balloons { position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
  button.balloon {
    position:absolute; bottom:-130px; width:58px; height:72px; padding:0; min-height:0; pointer-events:auto;
    background:var(--c); border-radius:50% 50% 48% 48% / 45% 45% 55% 55%;
    box-shadow:inset -8px -8px 0 rgba(0,0,0,.14); animation:rise linear forwards;
  }
  button.balloon::after { content:""; position:absolute; left:50%; top:100%; width:2px; height:46px; background:rgba(255,246,236,.5); }
  button.balloon::before { content:""; position:absolute; inset:-14px; } /* bigger tap target */
  @keyframes rise { to { transform:translateY(-135vh) rotate(6deg); } }

  #mute { position:fixed; z-index:6; top:max(.75rem, env(safe-area-inset-top)); right:.75rem; width:48px; padding:0; font-size:1.3rem; background:var(--cream); box-shadow:0 4px 0 #b8aa98; }
  #confetti { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }

  @media (prefers-reduced-motion: reduce) {
    .fl { animation:grow .01s both !important; }
    #gift, .flame.on, .hint.pulse { animation:none !important; }
    .scene { transition-duration:.01s; }
  }
</style>
</head>
<body>

<button id="mute" type="button" aria-label="Couper la musique" aria-pressed="false">🔊</button>

<!-- 1. gift -->
<section class="scene active" id="s0">
  <h2 id="giftTitle">Un cadeau pour toi</h2>
  <svg id="gift" class="tap" viewBox="0 0 200 200" role="button" tabindex="0" aria-label="Boîte cadeau. Touche pour l’ouvrir.">
    <circle class="shine" cx="100" cy="100" r="95" fill="#ffd23f"/>
    <rect x="30" y="92" width="140" height="98" rx="8" fill="#ff4f8b"/>
    <rect x="88" y="92" width="24" height="98" fill="#ffd23f"/>
    <g class="lid">
      <rect x="20" y="64" width="160" height="34" rx="8" fill="#ff7aa8"/>
      <rect x="88" y="64" width="24" height="34" fill="#ffd23f"/>
      <path d="M100 64 C70 20 40 44 60 62 Z" fill="#3ee6b0"/>
      <path d="M100 64 C130 20 160 44 140 62 Z" fill="#3ee6b0"/>
      <circle cx="100" cy="62" r="9" fill="#1fa883"/>
    </g>
  </svg>
  <p class="hint pulse">Touche le cadeau pour l’ouvrir</p>
</section>

<!-- 2. cake -->
<section class="scene" id="s1">
  <h1 id="title"><span>Joyeux</span><span>anniversaire&nbsp;!</span></h1>
  <svg id="cake" class="tap" viewBox="0 0 300 250" role="button" tabindex="0" aria-label="Gâteau d’anniversaire. Touche pour allumer une bougie.">
    <circle id="glow" cx="150" cy="60" r="120"/>
    <g>
      <rect x="86" y="78" width="12" height="52" rx="3" fill="#fff"/><rect x="86" y="92" width="12" height="7" fill="#ff4f8b"/><rect x="86" y="108" width="12" height="7" fill="#ff4f8b"/>
      <path class="flame" d="M92 52 C100 62 100 74 92 76 C84 74 84 62 92 52Z"/>
    </g>
    <g>
      <rect x="144" y="68" width="12" height="62" rx="3" fill="#fff"/><rect x="144" y="84" width="12" height="7" fill="#3ee6b0"/><rect x="144" y="102" width="12" height="7" fill="#3ee6b0"/>
      <path class="flame" d="M150 42 C158 52 158 64 150 66 C142 64 142 52 150 42Z"/>
    </g>
    <g>
      <rect x="202" y="78" width="12" height="52" rx="3" fill="#fff"/><rect x="202" y="92" width="12" height="7" fill="#ffd23f"/><rect x="202" y="108" width="12" height="7" fill="#ffd23f"/>
      <path class="flame" d="M208 52 C216 62 216 74 208 76 C200 74 200 62 208 52Z"/>
    </g>
    <path d="M60 130 H240 V176 H60Z" fill="#ff4f8b"/>
    <path d="M60 130 H240 V146 C228 160 218 142 204 154 C192 164 182 144 168 154 C156 162 146 142 132 154 C120 164 108 144 96 154 C84 162 74 146 60 150Z" fill="#fff6ec"/>
    <path d="M30 176 H270 V226 H30Z" fill="#ffd23f"/>
    <path d="M30 176 H270 V190 C256 204 246 186 232 196 C218 206 208 186 194 196 C180 206 170 186 156 196 C142 206 130 186 116 196 C102 206 90 186 76 196 C62 204 48 188 30 194Z" fill="#fff6ec"/>
    <circle cx="70" cy="214" r="5" fill="#ff4f8b"/><circle cx="110" cy="210" r="5" fill="#3ee6b0"/><circle cx="150" cy="216" r="5" fill="#ff4f8b"/><circle cx="190" cy="210" r="5" fill="#3ee6b0"/><circle cx="230" cy="214" r="5" fill="#ff4f8b"/>
    <rect x="14" y="226" width="272" height="12" rx="6" fill="#3ee6b0"/>
  </svg>
  <p class="hint pulse" id="hint">Touche le gâteau pour allumer une bougie</p>
</section>

<!-- 3. message -->
<section class="scene" id="s2">
  <div id="card">
    <p id="msg"></p>
    <p id="from"></p>
    <button id="again" type="button">Rejouer</button>
  </div>
  <p class="hint">Éclate les ballons&nbsp;!</p>
</section>

<div id="garden" aria-hidden="true"></div>
<div id="balloons"></div>
<canvas id="confetti"></canvas>

<script>
  /* ---- EDIT THESE DEFAULTS ---- */
  const CONFIG = {
    name: "Maman",
    from: "Tes fils, Mhand et Milou",
    message: "Encore un tour autour du soleil, et tu rends toujours tout plus beau. J’espère que cette journée sera remplie de gâteau, de rires et de tous ceux que tu aimes. Tu mérites tout ça."
  };
  /* Or personalise via the link: ?name=Sam&from=Alex&msg=Your%20message */

  const q = new URLSearchParams(location.search);
  const name = (q.get("name") || CONFIG.name).trim();
  const from = (q.get("from") || CONFIG.from).trim();
  const $ = id => document.getElementById(id);

  if (name) {
    $("title").innerHTML = "<span>Joyeux</span><span>anniversaire,</span><span></span>";
    $("title").lastChild.textContent = name + "\u00a0!";
    $("giftTitle").textContent = "Un cadeau pour " + name;
    document.title = "Joyeux anniversaire, " + name + "\u00a0!";
  }
  $("msg").textContent = (q.get("msg") || CONFIG.message).trim();
  $("from").textContent = from ? "Bisous, " + from : "";

  /* ---- scenes ---- */
  const scenes = [...document.querySelectorAll(".scene")];
  let scene = 0, balloonTimer = null;
  function go(n) {
    scene = n;
    scenes.forEach((s, i) => { s.classList.toggle("active", i === n); s.classList.toggle("past", i < n); });
    clearInterval(balloonTimer);
    $("garden").classList.toggle("big", n === 2);
    if (n === 2) {
      petals(30);
      $("card").classList.remove("pop"); void $("card").offsetWidth; $("card").classList.add("pop");
      for (let i = 0; i < 5; i++) setTimeout(balloon, i * 180);
      balloonTimer = setInterval(() => { balloon(); petals(3); }, reduce ? 1800 : 800);
    }
  }
  const press = (el, fn) => {
    el.addEventListener("click", fn);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } });
  };

  /* ---- 1. gift ---- */
  const gift = $("gift");
  let opening = false;
  press(gift, () => {
    if (opening) return;
    opening = true;
    startAudio();
    gift.classList.add("shake");
    setTimeout(() => {
      gift.classList.remove("shake"); gift.classList.add("open");
      [72, 76, 79, 84].forEach((m, i) => sfx(m, .25, "triangle", .35, i * .07));
      burst(innerWidth / 2, innerHeight * .45, 110);
    }, 550);
    setTimeout(() => go(1), 1500);
  });

  /* ---- 2. cake: light candles one by one, then blow out ---- */
  const cake = $("cake"), hint = $("hint"), flames = [...cake.querySelectorAll(".flame")];
  let lit = 0, blowing = false;
  press(cake, () => {
    if (blowing) return;
    if (lit < 3) {
      flames[lit].classList.add("on");
      lit++;
      $("glow").style.opacity = lit * .07;
      sfx(72 + lit * 4, .2, "triangle", .35);
      burst(innerWidth / 2, innerHeight * .4, 20);
      if (lit < 3) hint.textContent = lit + " sur 3 allumées. Continue";
      else {
        hint.textContent = "Fais un vœu, puis touche pour les souffler";
        cake.setAttribute("aria-label", "Toutes les bougies sont allumées. Touche pour les souffler.");
      }
    } else {
      blowing = true;
      hint.textContent = "";
      flames.forEach((f, i) => setTimeout(() => { f.classList.remove("on"); sfx(70 - i * 5, .25, "sine", .4); }, i * 160));
      $("glow").style.opacity = 0;
      setTimeout(() => {
        burst(innerWidth / 2, innerHeight * .4, 150);
        setTimeout(() => burst(innerWidth * .15, innerHeight * .6, 70), 200);
        setTimeout(() => burst(innerWidth * .85, innerHeight * .6, 70), 400);
        go(2);
      }, 700);
    }
  });

  /* ---- 3. replay ---- */
  $("again").addEventListener("click", () => {
    lit = 0; blowing = false; opening = false;
    gift.classList.remove("open");
    hint.textContent = "Touche le gâteau pour allumer une bougie";
    cake.setAttribute("aria-label", "Gâteau d’anniversaire. Touche pour allumer une bougie.");
    document.querySelectorAll(".balloon").forEach(b => b.remove());
    go(0);
  });

  /* ---- balloons ---- */
  const bcolors = ["#ff4f8b", "#ffd23f", "#3ee6b0", "#9b7bff", "#ff8a4f"];
  function balloon() {
    if (scene !== 2) return;
    const b = document.createElement("button");
    b.className = "balloon";
    b.setAttribute("aria-label", "Éclater le ballon");
    b.style.cssText = `left:${4 + Math.random() * 82}%;--c:${bcolors[(Math.random() * 5) | 0]};animation-duration:${7 + Math.random() * 5}s`;
    b.addEventListener("click", () => {
      const r = b.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 28);
      sfx(40 + Math.random() * 20, .08, "square", .4);
      b.remove();
    });
    b.addEventListener("animationend", () => b.remove());
    $("balloons").append(b);
  }

  /* ---- music: Happy Birthday synthesised with Web Audio (no audio file needed) ---- */
  const B = 60 / 108;
  const MEL = [[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2], [67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
               [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,1], [77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2]];
  const CH = { C:[48,[60,64,67]], G:[43,[59,62,67]], F:[41,[57,60,65]] };
  const PROG = ["C","G","C","C","C","F","F","C"];
  let AC, master, muted = false;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function tone(m, t, d, type, v) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + d + .05);
  }
  function sfx(m, d, type, v, delay = 0) { if (AC && !muted) tone(m, AC.currentTime + delay, d, type, v); }
  function loop(t0) {
    let t = t0;
    MEL.forEach(([m, b]) => { tone(m, t, b * B * 1.2, "triangle", .5); t += b * B; });
    PROG.forEach((c, i) => {
      const s = t0 + i * 3 * B, [bass, tri] = CH[c];
      tone(bass, s, B * 1.5, "sine", .6);
      [1, 2].forEach(k => tri.forEach(n => tone(n, s + k * B, B * .8, "sine", .12)));
    });
    const next = t0 + 24 * B;
    setTimeout(() => loop(next), Math.max(0, (next - AC.currentTime - 1) * 1000));
  }
  function startAudio() {
    if (AC) return;
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = muted ? 0 : .22; master.connect(AC.destination);
      loop(AC.currentTime + .1);
    } catch (e) { AC = null; }
  }
  $("mute").addEventListener("click", e => {
    muted = !muted;
    e.currentTarget.textContent = muted ? "🔇" : "🔊";
    e.currentTarget.setAttribute("aria-pressed", muted);
    e.currentTarget.setAttribute("aria-label", muted ? "Réactiver la musique" : "Couper la musique");
    if (master) master.gain.setTargetAtTime(muted ? 0 : .22, AC.currentTime, .05);
  });
  document.addEventListener("visibilitychange", () => {
    if (AC) document.hidden ? AC.suspend() : AC.resume();
  });

  /* ---- flowers ---- */
  const FL = [[3,38,"#ff4f8b"],[14,50,"#ffd23f"],[26,32,"#fff6ec"],[38,44,"#9b7bff"],[50,56,"#ff4f8b"],[62,36,"#ff8a4f"],[73,48,"#fff6ec"],[84,40,"#ffd23f"],[92,52,"#9b7bff"]];
  FL.forEach(([x, w, c], i) => {
    const d = document.createElement("div");
    d.className = "fl";
    d.style.cssText = `left:${x}%;width:${w}px;height:${w * 140 / 60}px;--d:${.3 + i * .15}s`;
    let pt = "";
    for (let k = 0; k < 6; k++) pt += `<ellipse cx="30" cy="16" rx="8" ry="14" transform="rotate(${k * 60} 30 30)" fill="${c}"/>`;
    d.innerHTML = `<svg viewBox="0 0 60 140" width="100%" height="100%"><path d="M30 38 C30 80 24 110 30 140" stroke="#1fa883" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse cx="19" cy="98" rx="11" ry="5" transform="rotate(-30 19 98)" fill="#1fa883"/><ellipse cx="41" cy="82" rx="11" ry="5" transform="rotate(30 41 82)" fill="#3ee6b0"/>${pt}<circle cx="30" cy="30" r="7" fill="${c === "#ffd23f" ? "#ff8a4f" : "#ffd23f"}"/></svg>`;
    $("garden").append(d);
  });
  const pcolors = ["#ff9ec0", "#fff6ec", "#ffb3d1", "#ffd23f"];
  function petals(n) {
    if (reduce) n = Math.ceil(n / 4);
    for (let i = 0; i < n; i++) {
      parts.push({ x: Math.random() * innerWidth, y: -10, vx: (Math.random() - .5) * 2, vy: 1 + Math.random() * 2,
                   w: 12, h: 7, r: Math.random() * 6, vr: (Math.random() - .5) * .1, c: pcolors[(Math.random() * 4) | 0],
                   life: 0, max: 600, g: .03, petal: 1 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  /* ---- confetti ---- */
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const colors = ["#ff4f8b", "#ffd23f", "#3ee6b0", "#fff6ec", "#9b7bff"];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let parts = [], raf = null;
  function resize() {
    const d = devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener("resize", resize); resize();
  function burst(x, y, n) {
    if (reduce) n = Math.ceil(n / 4);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
                   r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[(Math.random() * 5) | 0], life: 0 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.y < innerHeight + 20 && p.life < (p.max || 220));
    for (const p of parts) {
      p.vy += p.g || .22; if (p.petal) p.x += Math.sin(p.life / 20); p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.min(1, ((p.max || 220) - p.life) / 40);
      ctx.fillStyle = p.c;
      if (p.petal) { ctx.beginPath(); ctx.ellipse(0, 0, p.w / 2, p.h / 2, 0, 0, 7); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : null;
  }
</script>
</body>
</html>
